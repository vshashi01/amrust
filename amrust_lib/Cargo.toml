[package]
name = "amrust_lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "amrust_lib"
path = "src/lib.rs"

[dependencies]
egui = { version = "0.31.1" }
anyhow = "1.0.86"
roxmltree = "0.20.0"
log = "0.4.22"
image = "0.25.0"

# For image support:
egui_extras = { version = "0.31.0", features = ["default", "image"] }

amrust_3mf = { path = "../amrust_3mf" }
