[[bin]]
name = "AMRUST_RENDER_DEMO"
version = "0.1.0"
path = "src/main.rs"

[package]
name = "amrust_render_demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]


winit = { workspace = true, features = ["rwh_05"] }
egui-wgpu = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
env_logger = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
cfg-if = { workspace = true }
log = { workspace = true }
egui-winit = { workspace = true }
egui = { workspace = true }
glam = { workspace = true }
egui-file-dialog = { version = "0.11.0" }
thiserror = { workspace = true }
egui_dock = { workspace = true }
slotmap = { version = "1.1.1" }
smol = { version = "2.0.2" }
image = { version = "0.25.9" }
async-trait = { version = "0.1.89" }
rkyv = { version = "0.8.12", features = ["bytecheck"] }
rkyv_derive = { version = "0.8.12", features = ["bytecheck"] }
bytecheck = { version = "0.8.2" }
egui_logger = { version = "0.8.0" }
egui-toast = { version = "0.18.0" }
statig = { version = "0.4.1", features = ["macro"] }
