[package]
name = "amrust"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31.0", features = ["default", "wgpu"] }
egui = "0.31.0"

# For image support:
egui_extras = { version = "0.31.0", features = ["default", "image"] }

env_logger = { version = "0.11.5", default-features = false, features = [
    "auto-color",
    "humantime",
] }
egui_code_editor = "0.2.12"
threemf = { version = "0.8.0", path = "../3mf-rs/" }
instant-xml = { version = "0.6.0" }

zip = "2.1.6"
anyhow = "1.0.86"
xml_dom = "0.2.8"
egui_logger = "0.6.2"
log = "0.4.22"
image = "0.25.0"

[patch.crates-io]
instant-xml = { git = "https://github.com/djc/instant-xml.git" }
